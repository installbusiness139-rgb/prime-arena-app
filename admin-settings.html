<!DOCTYPE html>
<html>
<head>
  <title>Settings - Prime Arena Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0a0e27;
      color: white;
      font-family: 'Arial', sans-serif;
      padding-bottom: 80px;
      min-height: 100vh;
    }
    
    .topbar {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #0d1230;
      border-bottom: 1px solid #2a2f4a;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 15px;
    }
    
    .back-btn { font-size: 24px; color: white; cursor: pointer; }
    
    .topbar-title {
      font-size: 16px;
      font-weight: bold;
      color: white;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .admin-badge {
      background: linear-gradient(135deg, #ff6b00, #ffa500);
      color: white;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: bold;
    }
    
    .section-head {
      padding: 20px 15px 10px;
      font-size: 13px;
      font-weight: bold;
      color: #ffa500;
      letter-spacing: 0.5px;
    }
    
    .setting-card {
      background: #1a1f3a;
      border-radius: 12px;
      padding: 15px;
      margin: 0 15px 12px;
      border: 1px solid #2a2f4a;
    }
    
    .setting-label {
      font-size: 11px;
      color: #ccc;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      display: block;
    }
    
    .setting-input {
      width: 100%;
      padding: 13px;
      background: #0a0e27;
      border: 1px solid #2a2f4a;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      outline: none;
    }
    
    .setting-input:focus { border-color: #ffa500; }
    .setting-input::placeholder { color: #666; }
    
    .save-btn {
      margin: 20px 15px;
      width: calc(100% - 30px);
      padding: 16px;
      background: linear-gradient(135deg, #00c853, #00e676);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
    }
    
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #00c853;
      color: white;
      padding: 12px 25px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: bold;
      display: none;
      z-index: 2000;
    }
    
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0d1230;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      border-top: 1px solid #2a2f4a;
      z-index: 100;
    }
    
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      color: #666;
      font-size: 9px;
      padding: 5px 8px;
      flex: 1;
    }
    
    .nav-item.active { color: #ffa500; }
    .nav-icon { font-size: 20px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="back-btn" onclick="window.location.href='admin.html'">←</div>
    <div class="topbar-title">
      Settings
      <span class="admin-badge">ADMIN</span>
    </div>
  </div>

  <div class="section-head">💳 PAYMENT SETTINGS</div>
  
  <div class="setting-card">
    <label class="setting-label">ADMIN UPI ID</label>
    <input type="text" class="setting-input" id="upiId" placeholder="e.g. primearena@ybl">
  </div>
  
  <div class="setting-card">
    <label class="setting-label">UPI QR CODE IMAGE URL</label>
    <input type="text" class="setting-input" id="qrCodeUrl" placeholder="https://i.ibb.co/...">
  </div>

  <div class="section-head">💸 WITHDRAWAL SETTINGS</div>
  
  <div class="setting-card">
    <label class="setting-label">MINIMUM WITHDRAWAL (₹)</label>
    <input type="number" class="setting-input" id="minWithdraw" placeholder="e.g. 50">
  </div>
  
  <div class="setting-card">
    <label class="setting-label">MAXIMUM WITHDRAWAL (₹)</label>
    <input type="number" class="setting-input" id="maxWithdraw" placeholder="e.g. 1000">
  </div>
  
  <div class="setting-card">
    <label class="setting-label">WITHDRAWAL CHARGE (%)</label>
    <input type="number" class="setting-input" id="withdrawCharge" placeholder="e.g. 5">
  </div>

  <div class="section-head">🎧 SUPPORT SETTINGS</div>
  
  <div class="setting-card">
    <label class="setting-label">WHATSAPP QR CODE IMAGE URL</label>
    <input type="text" class="setting-input" id="whatsappQr" placeholder="https://i.ibb.co/...">
  </div>
  
  <div class="setting-card">
    <label class="setting-label">INSTAGRAM PROFILE LINK</label>
    <input type="text" class="setting-input" id="instagramLink" placeholder="https://instagram.com/...">
  </div>
  
  <div class="setting-card">
    <label class="setting-label">TELEGRAM CHANNEL LINK</label>
    <input type="text" class="setting-input" id="telegramLink" placeholder="https://t.me/...">
  </div>

  <div class="section-head">🎁 REFERRAL SETTINGS</div>
  
  <div class="setting-card">
    <label class="setting-label">REFERRAL BONUS (COINS)</label>
    <input type="number" class="setting-input" id="referralBonus" placeholder="e.g. 5">
  </div>

  <div class="section-head">📱 APP SETTINGS</div>
  
  <div class="setting-card">
    <label class="setting-label">SUPPORT NUMBER</label>
    <input type="text" class="setting-input" id="supportNumber" placeholder="e.g. +91 9876543210">
  </div>
  
  <div class="setting-card">
    <label class="setting-label">APP VERSION</label>
    <input type="text" class="setting-input" id="appVersion" placeholder="e.g. 1.0.0">
  </div>

  <button class="save-btn" id="saveBtn" onclick="saveSettings()">💾 SAVE ALL SETTINGS</button>

  <div class="toast" id="toast">Settings Saved!</div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='admin.html'">
      <span class="nav-icon">🏠</span>
      <span>Dashboard</span>
    </div>
    <div class="nav-item" onclick="window.location.href='admin-users.html'">
      <span class="nav-icon">👥</span>
      <span>Users</span>
    </div>
    <div class="nav-item" onclick="window.location.href='admin-deposits.html'">
      <span class="nav-icon">💳</span>
      <span>Deposits</span>
    </div>
    <div class="nav-item" onclick="window.location.href='admin-withdrawals.html'">
      <span class="nav-icon">💸</span>
      <span>Withdrawals</span>
    </div>
    <div class="nav-item active" onclick="window.location.href='admin-settings.html'">
      <span class="nav-icon">⚙️</span>
      <span>Settings</span>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyC22oO0eveUN3GL9WNtJSzdKghN-X67ZmU",
      authDomain: "prime-arena-a302b.firebaseapp.com",
      projectId: "prime-arena-a302b",
      storageBucket: "prime-arena-a302b.firebasestorage.app",
      messagingSenderId: "118236794000",
      appId: "1:118236794000:web:cd0e5bf7503b72f1cf5c15",
      measurementId: "G-EQJP1D9C92"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();

    function loadSettings() {
      db.collection("settings").doc("payment").get().then(function(paymentDoc) {
        if (paymentDoc.exists) {
          var p = paymentDoc.data();
          document.getElementById('upiId').value = p.upiId || '';
          document.getElementById('qrCodeUrl').value = p.qrCodeUrl || '';
        }
      });
      
      db.collection("settings").doc("withdrawal").get().then(function(withdrawDoc) {
        if (withdrawDoc.exists) {
          var w = withdrawDoc.data();
          document.getElementById('minWithdraw').value = w.minWithdraw || '50';
          document.getElementById('maxWithdraw').value = w.maxWithdraw || '1000';
          document.getElementById('withdrawCharge').value = w.withdrawCharge || '5';
        }
      });
      
      db.collection("settings").doc("support").get().then(function(supportDoc) {
        if (supportDoc.exists) {
          var s = supportDoc.data();
          document.getElementById('whatsappQr').value = s.whatsappQr || '';
          document.getElementById('instagramLink').value = s.instagramLink || '';
          document.getElementById('telegramLink').value = s.telegramLink || '';
        }
      });
      
      db.collection("settings").doc("app").get().then(function(appDoc) {
        if (appDoc.exists) {
          var a = appDoc.data();
          document.getElementById('referralBonus').value = a.referralBonus || '5';
          document.getElementById('supportNumber').value = a.supportNumber || '';
          document.getElementById('appVersion').value = a.appVersion || '1.0.0';
        }
      });
    }

    function saveSettings() {
      document.getElementById('saveBtn').disabled = true;
      document.getElementById('saveBtn').textContent = 'SAVING...';
      
      db.collection("settings").doc("payment").set({
        upiId: document.getElementById('upiId').value.trim(),
        qrCodeUrl: document.getElementById('qrCodeUrl').value.trim()
      }).then(function() {
        return db.collection("settings").doc("withdrawal").set({
          minWithdraw: document.getElementById('minWithdraw').value.trim(),
          maxWithdraw: document.getElementById('maxWithdraw').value.trim(),
          withdrawCharge: document.getElementById('withdrawCharge').value.trim()
        });
      }).then(function() {
        return db.collection("settings").doc("support").set({
          whatsappQr: document.getElementById('whatsappQr').value.trim(),
          instagramLink: document.getElementById('instagramLink').value.trim(),
          telegramLink: document.getElementById('telegramLink').value.trim()
        });
      }).then(function() {
        return db.collection("settings").doc("app").set({
          referralBonus: document.getElementById('referralBonus').value.trim(),
          supportNumber: document.getElementById('supportNumber').value.trim(),
          appVersion: document.getElementById('appVersion').value.trim()
        });
      }).then(function() {
        showToast('✅ Settings Saved Successfully!');
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('saveBtn').textContent = '💾 SAVE ALL SETTINGS';
      }).catch(function(error) {
        alert('Error: ' + error.message);
        document.getElementById('saveBtn').disabled = false;
        document.getElementById('saveBtn').textContent = '💾 SAVE ALL SETTINGS';
      });
    }

    function showToast(msg) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(function() {
        toast.style.display = 'none';
      }, 2500);
    }

    loadSettings();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Manage FAQs - Prime Arena</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0f121d; 
      color: white; 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      min-height: 100vh; 
    }
    
    .header { 
      margin-bottom: 25px; 
      border-bottom: 1px solid #2a2f4a;
      padding-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { 
      font-size: 22px; 
      font-weight: bold; 
      color: #fca311;
    }
    .back-btn {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      background: #2a2f4a;
      padding: 8px 12px;
      border-radius: 6px;
    }

    /* फॉर्म का डिज़ाइन */
    .admin-form-box {
      background: #1a1f3a;
      border: 1px solid #2a2f4a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .admin-form-box h2 {
      font-size: 16px;
      color: #fff;
      margin-bottom: 15px;
      border-left: 3px solid #fca311;
      padding-left: 10px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 5px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px;
      background: #0f121d;
      border: 1px solid #2a2f4a;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: #fca311;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    .add-btn {
      width: 100%;
      padding: 14px;
      background: #10b981;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .add-btn:active { transform: scale(0.98); }
    .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* लिस्ट का डिज़ाइन */
    .list-header {
      font-size: 16px;
      color: #fff;
      margin-bottom: 15px;
      border-left: 3px solid #fca311;
      padding-left: 10px;
    }
    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .faq-item {
      background: #1a1f3a;
      border: 1px solid #2a2f4a;
      border-radius: 10px;
      padding: 15px;
      position: relative;
    }
    .faq-item .q-text {
      font-weight: bold;
      color: #fca311;
      font-size: 14px;
      margin-bottom: 6px;
      padding-right: 30px;
    }
    .faq-item .a-text {
      color: #b0b5c9;
      font-size: 13px;
      line-height: 1.5;
      padding-right: 30px;
    }
    .delete-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 49, 49, 0.1);
      color: #ff3131;
      border: 1px solid #ff3131;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .delete-btn:active { transform: scale(0.9); }

    /* लोडिंग और खाली स्टेट */
    .loading-msg, .empty-msg {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      padding: 20px;
      display: none;
    }
    .empty-msg { color: #fca311; }

    /* ================= CUSTOM POPUP CSS START ================= */
    .popup-overlay {
      display: none; 
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8); 
      z-index: 10000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(3px);
    }
    .popup-box {
      background: #0f121d; 
      border: 1px solid #d4af37; 
      border-radius: 12px;
      padding: 25px 20px;
      width: 85%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .popup-box h3 { color: #fca311; margin-top: 0; font-size: 22px; margin-bottom: 10px; }
    .popup-box p { color: #ffffff; font-size: 15px; margin-bottom: 25px; line-height: 1.5; }
    .popup-buttons { display: flex; gap: 12px; }
    .popup-btn {
      flex: 1; padding: 12px; border: none; border-radius: 8px;
      font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; text-transform: uppercase;
    }
    .popup-btn-cancel { background: #2a2d3e; color: #ffffff; }
    .popup-btn-confirm { background: #10b981; color: #ffffff; }
    .popup-btn:active { transform: scale(0.95); }
    /* ================= CUSTOM POPUP CSS END ================= */
  </style>
</head>
<body>

  <div class="header">
    <h1>⚙️ Manage FAQs</h1>
    <a href="admin.html" class="back-btn">← Dashboard</a>
  </div>

  <!-- FAQ ऐड करने का फॉर्म -->
  <div class="admin-form-box">
    <h2>Add New FAQ</h2>
    <div class="form-group">
      <label>Question</label>
      <input type="text" id="faqQuestion" placeholder="e.g. How to join a tournament?">
    </div>
    <div class="form-group">
      <label>Answer</label>
      <textarea id="faqAnswer" placeholder="e.g. Go to Tournaments tab and click Join Now..."></textarea>
    </div>
    <button class="add-btn" id="addBtn" onclick="addFaq()">➕ ADD FAQ</button>
  </div>

  <!-- मौजूदा FAQs की लिस्ट -->
  <div class="list-header">Existing FAQs</div>
  <div class="loading-msg" id="loadingMsg">⏳ Loading FAQs...</div>
  <div class="empty-msg" id="emptyMsg">No FAQs added yet.</div>
  <div class="faq-list" id="faqList"></div>

  <!-- ================= CUSTOM POPUP HTML START ================= -->
  <div id="customPopupModal" class="popup-overlay">
    <div class="popup-box">
      <h3 id="popupTitle">Title</h3>
      <p id="popupMessage">Message goes here.</p>
      <div class="popup-buttons">
        <button id="popupCancelBtn" class="popup-btn popup-btn-cancel">CANCEL</button>
        <button id="popupConfirmBtn" class="popup-btn popup-btn-confirm">CONFIRM</button>
      </div>
    </div>
  </div>
  <!-- ================= CUSTOM POPUP HTML END ================= -->

  <script>
    // Firebase Configuration
    var firebaseConfig = {
      apiKey: "AIzaSyC22oO0eveUN3GL9WNtJSzdKghN-X67ZmU",
      authDomain: "prime-arena-a302b.firebaseapp.com",
      projectId: "prime-arena-a302b",
      storageBucket: "prime-arena-a302b.firebasestorage.app",
      messagingSenderId: "118236794000",
      appId: "1:118236794000:web:cd0e5bf7503b72f1cf5c15",
      measurementId: "G-EQJP1D9C92"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    var db = firebase.firestore();

    /* ================= CUSTOM POPUP JS ================= */
    function showPopup(title, message, isConfirm = true) {
      return new Promise((resolve) => {
        const modal = document.getElementById('customPopupModal');
        const titleEl = document.getElementById('popupTitle');
        const msgEl = document.getElementById('popupMessage');
        const cancelBtn = document.getElementById('popupCancelBtn');
        const confirmBtn = document.getElementById('popupConfirmBtn');

        titleEl.innerText = title;
        msgEl.innerText = message;
        cancelBtn.style.display = isConfirm ? 'block' : 'none';
        modal.style.display = 'flex';

        const newCancelBtn = cancelBtn.cloneNode(true);
        const newConfirmBtn = confirmBtn.cloneNode(true);
        cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);
        confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);

        newCancelBtn.addEventListener('click', () => { modal.style.display = 'none'; resolve(false); });
        newConfirmBtn.addEventListener('click', () => { modal.style.display = 'none'; resolve(true); });
      });
    }

    // 1. नया FAQ ऐड करने का फंक्शन
    function addFaq() {
      var question = document.getElementById('faqQuestion').value.trim();
      var answer = document.getElementById('faqAnswer').value.trim();
      var btn = document.getElementById('addBtn');

      if (!question || !answer) {
        showPopup("Error!", "Please fill both Question and Answer fields.", false);
        return;
      }

      btn.disabled = true;
      btn.innerText = "ADDING...";

      db.collection("faqs").add({
        question: question,
        answer: answer,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function() {
        btn.disabled = false;
        btn.innerText = "➕ ADD FAQ";
        document.getElementById('faqQuestion').value = '';
        document.getElementById('faqAnswer').value = '';
        showPopup("Success!", "FAQ added successfully.", false);
        loadFaqs(); 
      }).catch(function(error) {
        btn.disabled = false;
        btn.innerText = "➕ ADD FAQ";
        showPopup("Error!", "Error adding FAQ: " + error.message, false);
      });
    }

    // 2. मौजूदा FAQs को लोड करने का फंक्शन
    function loadFaqs() {
      var list = document.getElementById('faqList');
      var loading = document.getElementById('loadingMsg');
      var empty = document.getElementById('emptyMsg');
      
      list.innerHTML = '';
      loading.style.display = 'block';
      empty.style.display = 'none';

      db.collection("faqs").orderBy("createdAt", "desc").get().then(function(snapshot) {
        loading.style.display = 'none';
        
        if (snapshot.empty) {
          empty.style.display = 'block';
          return;
        }

        snapshot.forEach(function(doc) {
          var data = doc.data();
          var faqHTML = `
            <div class="faq-item">
              <div class="q-text">Q: ${data.question}</div>
              <div class="a-text">A: ${data.answer}</div>
              <button class="delete-btn" onclick="deleteFaq('${doc.id}')">DELETE</button>
            </div>
          `;
          list.innerHTML += faqHTML;
        });
      }).catch(function(error) {
        loading.style.display = 'none';
        console.error("Error: ", error);
        showPopup("Error!", "Error loading FAQs: " + error.message, false);
      });
    }

    // 3. FAQ डिलीट करने का फंक्शन
    function deleteFaq(id) {
      showPopup("Delete FAQ?", "Are you sure you want to delete this FAQ?", true).then((result) => {
        if (result === true) {
          db.collection("faqs").doc(id).delete().then(function() {
            showPopup("Deleted!", "FAQ has been deleted.", false);
            loadFaqs(); 
          }).catch(function(error) {
            showPopup("Error!", "Error deleting FAQ: " + error.message, false);
          });
        }
      });
    }

    document.addEventListener("DOMContentLoaded", loadFaqs);

  </script>
</body>
</html>

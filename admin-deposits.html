<!DOCTYPE html>
<html>
<head>
  <title>Deposit Management - Prime Arena Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e27; color: white; font-family: 'Arial', sans-serif; padding-bottom: 80px; min-height: 100vh; }
    .topbar { display: flex; align-items: center; padding: 15px; background: #0d1230; border-bottom: 1px solid #2a2f4a; position: sticky; top: 0; z-index: 100; gap: 15px; }
    .back-btn { font-size: 24px; color: white; cursor: pointer; }
    .topbar-title { font-size: 16px; font-weight: bold; color: white; display: flex; align-items: center; gap: 8px; }
    .admin-badge { background: linear-gradient(135deg, #ff6b00, #ffa500); color: white; font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
    .filter-tabs { display: flex; padding: 15px; gap: 8px; overflow-x: auto; }
    .filter-tab { padding: 10px 18px; background: #1a1f3a; border: 1px solid #2a2f4a; border-radius: 20px; font-size: 12px; color: #ccc; cursor: pointer; white-space: nowrap; font-weight: bold; }
    .filter-tab.active { background: linear-gradient(135deg, #ff6b00, #ffa500); color: white; border-color: #ffa500; }
    .deposit-list { padding: 0 15px; }
    .deposit-card { background: #1a1f3a; border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #2a2f4a; border-left: 4px solid #ffa500; }
    .deposit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .deposit-amount { font-size: 22px; font-weight: bold; color: #00c853; }
    .deposit-status { font-size: 10px; padding: 4px 10px; border-radius: 10px; font-weight: bold; text-transform: uppercase; }
    .status-pending { background: #ffa500; color: #0a0e27; }
    .status-approved { background: #00c853; color: white; }
    .status-rejected { background: #ff3131; color: white; }
    .deposit-details { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-size: 12px; }
    .detail-row { display: flex; justify-content: space-between; }
    .detail-label { color: #666; }
    .detail-value { color: #ccc; font-weight: 500; word-break: break-all; text-align: right; max-width: 60%; }
    .detail-value.utr { color: #ffa500; font-family: monospace; letter-spacing: 1px; }
    .action-buttons { display: flex; gap: 10px; }
    .approve-btn { flex: 1; padding: 12px; background: linear-gradient(135deg, #00c853, #00e676); border: none; border-radius: 8px; color: white; font-size: 13px; font-weight: bold; cursor: pointer; }
    .reject-btn { flex: 1; padding: 12px; background: linear-gradient(135deg, #ff3131, #ff5252); border: none; border-radius: 8px; color: white; font-size: 13px; font-weight: bold; cursor: pointer; }
    .empty-state { text-align: center; padding: 60px 20px; color: #666; }
    .empty-icon { font-size: 60px; margin-bottom: 15px; opacity: 0.5; }
    .empty-text { font-size: 15px; margin-bottom: 5px; }
    .empty-subtext { font-size: 12px; color: #444; }
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #00c853; color: white; padding: 12px 25px; border-radius: 25px; font-size: 13px; font-weight: bold; display: none; z-index: 1000; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0d1230; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #2a2f4a; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: #666; font-size: 9px; padding: 5px 8px; flex: 1; }
    .nav-item.active { color: #ffa500; }
    .nav-icon { font-size: 20px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="back-btn" onclick="window.location.href='admin.html'">←</div>
    <div class="topbar-title">
      Deposit Management
      <span class="admin-badge">ADMIN</span>
    </div>
  </div>

  <div class="filter-tabs">
    <div class="filter-tab active" onclick="filterDeposits('pending', this)">Pending</div>
    <div class="filter-tab" onclick="filterDeposits('approved', this)">Approved</div>
    <div class="filter-tab" onclick="filterDeposits('rejected', this)">Rejected</div>
    <div class="filter-tab" onclick="filterDeposits('all', this)">All</div>
  </div>

  <div class="deposit-list" id="depositList">
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      <div class="empty-text">Loading deposits...</div>
    </div>
  </div>

  <div class="toast" id="toast">Success!</div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='admin.html'">
      <span class="nav-icon">🏠</span>
      <span>Dashboard</span>
    </div>
    <div class="nav-item" onclick="window.location.href='admin-users.html'">
      <span class="nav-icon">👥</span>
      <span>Users</span>
    </div>
    <div class="nav-item active" onclick="window.location.href='admin-deposits.html'">
      <span class="nav-icon">💳</span>
      <span>Deposits</span>
    </div>
    <div class="nav-item" onclick="window.location.href='admin-withdrawals.html'">
      <span class="nav-icon">💸</span>
      <span>Withdrawals</span>
    </div>
    <div class="nav-item" onclick="window.location.href='admin-settings.html'">
      <span class="nav-icon">⚙️</span>
      <span>Settings</span>
    </div>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyC22oO0eveUN3GL9WNtJSzdKghN-X67ZmU",
      authDomain: "prime-arena-a302b.firebaseapp.com",
      projectId: "prime-arena-a302b",
      storageBucket: "prime-arena-a302b.firebasestorage.app",
      messagingSenderId: "118236794000",
      appId: "1:118236794000:web:cd0e5bf7503b72f1cf5c15",
      measurementId: "G-EQJP1D9C92"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();

    var currentFilter = 'pending';
    var allDeposits = [];

    // ===== Custom Popup =====
    function showCustomPopup(title, message, onConfirm, showCancel) {
      var popup = document.createElement('div');
      popup.id = 'customPopup';
      popup.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:9999;padding:20px;';
      
      var box = document.createElement('div');
      box.style.cssText = 'background:#1a1f3a;border-radius:15px;padding:25px;width:100%;max-width:350px;border:1px solid #ffa500;';
      
      var titleEl = document.createElement('div');
      titleEl.style.cssText = 'font-size:18px;font-weight:bold;color:#ffa500;margin-bottom:12px;text-align:center;';
      titleEl.textContent = title;
      
      var msgEl = document.createElement('div');
      msgEl.style.cssText = 'font-size:14px;color:#ccc;line-height:1.5;margin-bottom:20px;text-align:center;';
      msgEl.textContent = message;
      
      var btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex;gap:10px;';
      
      if (showCancel) {
        var cancelBtn = document.createElement('button');
        cancelBtn.textContent = 'CANCEL';
        cancelBtn.style.cssText = 'flex:1;padding:14px;background:#2a2f4a;border:none;border-radius:10px;color:white;font-size:14px;font-weight:bold;cursor:pointer;';
        cancelBtn.onclick = function() {
          document.body.removeChild(popup);
        };
        
        var confirmBtn = document.createElement('button');
        confirmBtn.textContent = 'CONFIRM';
        confirmBtn.style.cssText = 'flex:1;padding:14px;background:linear-gradient(135deg,#00c853,#00e676);border:none;border-radius:10px;color:white;font-size:14px;font-weight:bold;cursor:pointer;';
        confirmBtn.onclick = function() {
          document.body.removeChild(popup);
          if (onConfirm) onConfirm();
        };
        
        btnRow.appendChild(cancelBtn);
        btnRow.appendChild(confirmBtn);
      } else {
        var okBtn = document.createElement('button');
        okBtn.textContent = 'OK';
        okBtn.style.cssText = 'flex:1;padding:14px;background:linear-gradient(135deg,#00c853,#00e676);border:none;border-radius:10px;color:white;font-size:14px;font-weight:bold;cursor:pointer;';
        okBtn.onclick = function() {
          document.body.removeChild(popup);
          if (onConfirm) onConfirm();
        };
        
        btnRow.appendChild(okBtn);
      }
      
      box.appendChild(titleEl);
      box.appendChild(msgEl);
      box.appendChild(btnRow);
      popup.appendChild(box);
      document.body.appendChild(popup);
    }

    // ===== Load Deposits =====
    function loadDeposits() {
      db.collection("deposits").get().then(function(querySnapshot) {
        allDeposits = [];
        querySnapshot.forEach(function(doc) {
          var data = doc.data();
          data.id = doc.id;
          allDeposits.push(data);
        });
        
        allDeposits.sort(function(a, b) {
          return new Date(b.createdAt) - new Date(a.createdAt);
        });
        
        displayDeposits();
      }).catch(function(error) {
        console.error("Error:", error);
        document.getElementById('depositList').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">❌</div>
            <div class="empty-text">Error: ${error.message}</div>
          </div>
        `;
      });
    }

    function displayDeposits() {
      var list = document.getElementById('depositList');
      
      var filtered = allDeposits.filter(function(d) {
        if (currentFilter === 'all') return true;
        return d.status === currentFilter;
      });
      
      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div class="empty-text">No Deposits Found</div>
            <div class="empty-subtext">No ${currentFilter} deposits yet.</div>
          </div>
        `;
        return;
      }
      
      var html = '';
      filtered.forEach(function(d) {
        var date = new Date(d.createdAt);
        var timeStr = date.toLocaleString('en-IN', { 
          day: '2-digit', month: 'short', 
          hour: '2-digit', minute: '2-digit' 
        });
        
        html += `
          <div class="deposit-card">
            <div class="deposit-header">
              <div class="deposit-amount">₹${d.amount}</div>
              <div class="deposit-status status-${d.status}">${d.status}</div>
            </div>
            <div class="deposit-details">
              <div class="detail-row">
                <span class="detail-label">User:</span>
                <span class="detail-value">${d.userName || 'Unknown'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Email:</span>
                <span class="detail-value">${d.userEmail || '-'}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">UTR:</span>
                <span class="detail-value utr">${d.utr}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Time:</span>
                <span class="detail-value">${timeStr}</span>
              </div>
            </div>
            ${d.status === 'pending' ? `
              <div class="action-buttons">
                <button class="approve-btn" data-approve-id="${d.id}">✓ APPROVE</button>
                <button class="reject-btn" data-reject-id="${d.id}">✗ REJECT</button>
              </div>
            ` : ''}
          </div>
        `;
      });
      
      list.innerHTML = html;
      
      list.querySelectorAll('[data-approve-id]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          approveDeposit(this.getAttribute('data-approve-id'));
        });
      });
      
      list.querySelectorAll('[data-reject-id]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          rejectDeposit(this.getAttribute('data-reject-id'));
        });
      });
    }

    function filterDeposits(filter, el) {
      currentFilter = filter;
      
      document.querySelectorAll('.filter-tab').forEach(function(tab) {
        tab.classList.remove('active');
      });
      el.classList.add('active');
      
      displayDeposits();
    }

    // ===== Approve Deposit =====
    function approveDeposit(id) {
      var deposit = allDeposits.find(d => d.id === id);
      if (!deposit) return;
      
      showCustomPopup(
        'Approve Deposit',
        'Approve this deposit? ' + deposit.amount + ' coins will be added to user wallet.',
        function() {
          db.collection("users").doc(deposit.userId).get().then(function(userSnap) {
            if (!userSnap.exists) {
              showCustomPopup('Error', 'User not found!', null, false);
              return;
            }
            
            var userData = userSnap.data();
            var currentBalance = userData.balance || 0;
            var currentDeposited = userData.deposited || 0;
            
            return db.collection("users").doc(deposit.userId).update({
              balance: currentBalance + deposit.amount,
              deposited: currentDeposited + deposit.amount
            });
          }).then(function() {
            return db.collection("deposits").doc(id).update({
              status: 'approved',
              approvedAt: new Date().toISOString()
            });
          }).then(function() {
            return db.collection("transactions").add({
              userId: deposit.userId,
              type: 'deposit',
              amount: deposit.amount,
              status: 'approved',
              timestamp: new Date().toISOString()
            });
          }).then(function() {
            showToast('✅ Deposit Approved!');
            loadDeposits();
          }).catch(function(error) {
            showCustomPopup('Error', error.message, null, false);
          });
        },
        true
      );
    }

    // ===== Reject Deposit =====
    function rejectDeposit(id) {
      showCustomPopup(
        'Reject Deposit',
        'Are you sure you want to reject this deposit?',
        function() {
          db.collection("deposits").doc(id).update({
            status: 'rejected',
            rejectedAt: new Date().toISOString()
          }).then(function() {
            showToast('Deposit Rejected!');
            loadDeposits();
          }).catch(function(error) {
            showCustomPopup('Error', error.message, null, false);
          });
        },
        true
      );
    }

    function showToast(msg) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(function() {
        toast.style.display = 'none';
      }, 3000);
    }

    loadDeposits();
  </script>
</body>
</html>

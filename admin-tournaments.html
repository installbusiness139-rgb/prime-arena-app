<!DOCTYPE html>
<html>
<head>
<title>Tournament Manager - Prime Arena Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e27;color:#fff;font-family:Arial;padding-bottom:80px}
.topbar{display:flex;align-items:center;padding:15px;background:#0d1230;border-bottom:1px solid #2a2f4a;position:sticky;top:0;z-index:100;gap:10px}
.back-btn{font-size:24px;color:#fff;cursor:pointer}
.topbar-title{font-size:15px;font-weight:bold;flex:1}
.admin-badge{background:linear-gradient(135deg,#ff6b00,#ffa500);color:#fff;font-size:9px;padding:3px 7px;border-radius:10px;font-weight:bold;margin-left:6px}
.create-btn-top{background:linear-gradient(135deg,#00c853,#00e676);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer}
.section-head{padding:15px;font-size:14px;font-weight:bold;color:#ffa500}
.match-list{padding:0 15px}
.match-card{background:#1a1f3a;border-radius:12px;padding:15px;margin-bottom:12px;border:1px solid #2a2f4a;border-left:4px solid #ffa500}
.match-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
.match-title{font-size:13px;font-weight:bold;flex:1}
.match-status{font-size:9px;padding:3px 8px;border-radius:8px;font-weight:bold;text-transform:uppercase}
.status-upcoming{background:#00c853;color:#fff}
.status-live{background:#ff3131;color:#fff}
.status-completed{background:#666;color:#fff}
.match-details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.match-detail-item{background:#0a0e27;border-radius:8px;padding:8px 10px}
.match-detail-label{font-size:9px;color:#666;margin-bottom:2px}
.match-detail-value{font-size:13px;color:#ffa500;font-weight:bold}
.match-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-small{flex:1;min-width:90px;padding:10px;border:none;border-radius:8px;font-size:11px;font-weight:bold;cursor:pointer;color:#fff}
.btn-slots{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
.btn-edit{background:linear-gradient(135deg,#0088cc,#00aaff)}
.btn-delete{background:linear-gradient(135deg,#ff3131,#ff5252)}
.empty-state{text-align:center;padding:60px 20px;color:#666}
.empty-icon{font-size:60px;margin-bottom:15px;opacity:.5}
.empty-text{font-size:15px;margin-bottom:5px}
.empty-subtext{font-size:12px;color:#444;margin-bottom:20px}
.create-btn{background:linear-gradient(135deg,#00c853,#00e676);color:#fff;border:none;padding:14px 30px;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:flex-start;z-index:1000;padding:20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#1a1f3a;border-radius:15px;padding:20px;width:100%;max-width:500px;border:1px solid #ffa500;margin:auto 0}
.modal-title{font-size:16px;font-weight:bold;color:#ffa500;margin-bottom:20px;text-align:center}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:11px;color:#ccc;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;background:#0a0e27;border:1px solid #2a2f4a;border-radius:8px;color:#fff;font-size:13px;outline:none;font-family:inherit}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-buttons{display:flex;gap:10px;margin-top:20px}
.modal-btn{flex:1;padding:14px;border:none;border-radius:10px;font-size:13px;font-weight:bold;cursor:pointer;color:#fff}
.modal-cancel{background:#2a2f4a}
.modal-save{background:linear-gradient(135deg,#00c853,#00e676)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#00c853;color:#fff;padding:12px 25px;border-radius:25px;font-size:13px;font-weight:bold;display:none;z-index:2000}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0d1230;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #2a2f4a;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#666;font-size:9px;padding:5px 8px;flex:1}
.nav-item.active{color:#ffa500}
.nav-icon{font-size:20px}
.popup-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:10000;justify-content:center;align-items:center;backdrop-filter:blur(3px)}
.popup-box{background:#0f121d;border:1px solid #d4af37;border-radius:12px;padding:25px 20px;width:85%;max-width:350px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.8)}
.popup-box h3{color:#fca311;margin-top:0;font-size:22px;margin-bottom:10px}
.popup-box p{color:#fff;font-size:15px;margin-bottom:25px;line-height:1.5}
.popup-buttons{display:flex;gap:12px}
.popup-btn{flex:1;padding:12px;border:none;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer;transition:.2s;text-transform:uppercase}
.popup-btn-cancel{background:#2a2d3e;color:#fff}
.popup-btn-confirm{background:#10b981;color:#fff}
.popup-btn:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="topbar">
<div class="back-btn" onclick="location.href='admin.html'">←</div>
<div class="topbar-title">Tournament Manager<span class="admin-badge">ADMIN</span></div>
<button class="create-btn-top" id="newBtn" type="button">+ NEW</button>
</div>

<div class="section-head">ALL MATCHES</div>
<div class="match-list" id="matchList">
<div class="empty-state">
<div class="empty-icon">⏳</div>
<div class="empty-text">Loading matches...</div>
</div>
</div>

<div class="modal-overlay" id="matchModal">
<div class="modal">
<div class="modal-title" id="modalTitle">CREATE NEW MATCH</div>
<div class="form-group">
<label>MATCH TITLE</label>
<input type="text" id="matchTitle" placeholder="e.g. BR SURVIVAL">
</div>
<div class="form-group">
<label>BANNER IMAGE URL</label>
<input type="text" id="bannerUrl" placeholder="https://i.ibb.co/...">
</div>
<div class="form-row">
<div class="form-group">
<label>MODE</label>
<select id="matchMode">
<option value="Solo">Solo</option>
<option value="Duo">Duo</option>
<option value="Squad">Squad</option>
</select>
</div>
<div class="form-group">
<label>MAP</label>
<select id="matchMap">
<option value="Bermuda">Bermuda</option>
<option value="Purgatory">Purgatory</option>
<option value="Kalahari">Kalahari</option>
<option value="Alpine">Alpine</option>
<option value="NeXTerra">NeXTerra</option>
</select>
</div>
</div>
<div class="form-row">
<div class="form-group">
<label>ENTRY FEE (COINS)</label>
<input type="number" id="entryFee" placeholder="e.g. 11">
</div>
<div class="form-group">
<label>PRIZE POOL (COINS)</label>
<input type="number" id="prizePool" placeholder="e.g. 120">
</div>
</div>
<div class="form-row">
<div class="form-group">
<label>TOTAL SLOTS</label>
<input type="number" id="totalSlots" placeholder="e.g. 48">
</div>
<div class="form-group">
<label>JOINED PLAYERS</label>
<input type="number" id="joinedPlayers" value="0" readonly style="opacity:.6;cursor:not-allowed">
</div>
</div>
<div class="form-row">
<div class="form-group">
<label>DATE</label>
<input type="date" id="matchDate">
</div>
<div class="form-group">
<label>TIME</label>
<input type="time" id="matchTime">
</div>
</div>
<div class="form-group">
<label>PRIZE TYPE</label>
<select id="prizeType">
<option value="booyah">Booyah (Winner takes all)</option>
<option value="perkill">Per Kill</option>
</select>
</div>
<div class="form-row">
<div class="form-group">
<label>PER KILL PRIZE (COINS)</label>
<input type="number" id="perKillPrize" placeholder="e.g. 5">
</div>
<div class="form-group">
<label>BOOYAH PRIZE (COINS)</label>
<input type="number" id="booyahPrize" placeholder="e.g. 100">
</div>
</div>
<div class="form-row">
<div class="form-group">
<label>ROOM ID</label>
<input type="text" id="roomId" placeholder="e.g. 4820194">
</div>
<div class="form-group">
<label>ROOM PASSWORD</label>
<input type="text" id="roomPass" placeholder="e.g. CXA778">
</div>
</div>
<div class="form-group">
<label>RULES (one per line)</label>
<textarea id="matchRules" placeholder="Emulators strictly banned."></textarea>
</div>
<div class="form-group">
<label>STATUS</label>
<select id="matchStatus">
<option value="upcoming">Upcoming</option>
<option value="live">Live</option>
<option value="completed">Completed</option>
</select>
</div>
<div class="modal-buttons">
<button class="modal-btn modal-cancel" onclick="closeMatchModal()">CANCEL</button>
<button class="modal-btn modal-save" onclick="saveMatch()">SAVE MATCH</button>
</div>
</div>
</div>

<div class="toast" id="toast">Success!</div>

<div id="customPopupModal" class="popup-overlay">
<div class="popup-box">
<h3 id="popupTitle">Title</h3>
<p id="popupMessage">Message goes here.</p>
<div class="popup-buttons">
<button id="popupCancelBtn" class="popup-btn popup-btn-cancel">CANCEL</button>
<button id="popupConfirmBtn" class="popup-btn popup-btn-confirm">CONFIRM</button>
</div>
</div>
</div>

<div class="bottom-nav">
<div class="nav-item" onclick="location.href='admin.html'"><span class="nav-icon">🏠</span><span>Dashboard</span></div>
<div class="nav-item" onclick="location.href='admin-users.html'"><span class="nav-icon">👥</span><span>Users</span></div>
<div class="nav-item active" onclick="location.href='admin-tournaments.html'"><span class="nav-icon">🎮</span><span>Matches</span></div>
<div class="nav-item" onclick="location.href='admin-withdrawals.html'"><span class="nav-icon">💸</span><span>Withdrawals</span></div>
<div class="nav-item" onclick="location.href='admin-settings.html'"><span class="nav-icon">⚙️</span><span>Settings</span></div>
</div>

<script>
var firebaseConfig={apiKey:"AIzaSyC22oO0eveUN3GL9WNtJSzdKghN-X67ZmU",authDomain:"prime-arena-a302b.firebaseapp.com",projectId:"prime-arena-a302b",storageBucket:"prime-arena-a302b.firebasestorage.app",messagingSenderId:"118236794000",appId:"1:118236794000:web:cd0e5bf7503b72f1cf5c15",measurementId:"G-EQJP1D9C92"};

if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

var allMatches=[];
var editingMatchId=null;

function showPopup(title,message,isConfirm){
if(isConfirm===undefined)isConfirm=true;
return new Promise(function(resolve){
var modal=document.getElementById('customPopupModal');
var titleEl=document.getElementById('popupTitle');
var msgEl=document.getElementById('popupMessage');
var cancelBtn=document.getElementById('popupCancelBtn');
var confirmBtn=document.getElementById('popupConfirmBtn');
titleEl.innerText=title;
msgEl.innerText=message;
cancelBtn.style.display=isConfirm?'block':'none';
modal.style.display='flex';
var newCancelBtn=cancelBtn.cloneNode(true);
var newConfirmBtn=confirmBtn.cloneNode(true);
cancelBtn.parentNode.replaceChild(newCancelBtn,cancelBtn);
confirmBtn.parentNode.replaceChild(newConfirmBtn,confirmBtn);
newCancelBtn.addEventListener('click',function(){modal.style.display='none';resolve(false)});
newConfirmBtn.addEventListener('click',function(){modal.style.display='none';resolve(true)});
});
}

function openMatchModal(){
editingMatchId=null;
document.getElementById('modalTitle').textContent='CREATE NEW MATCH';
document.getElementById('matchTitle').value='';
document.getElementById('bannerUrl').value='';
document.getElementById('matchMode').value='Solo';
document.getElementById('matchMap').value='Bermuda';
document.getElementById('entryFee').value='';
document.getElementById('prizePool').value='';
document.getElementById('totalSlots').value='';
document.getElementById('joinedPlayers').value='0';
document.getElementById('matchDate').value='';
document.getElementById('matchTime').value='';
document.getElementById('prizeType').value='booyah';
document.getElementById('perKillPrize').value='';
document.getElementById('booyahPrize').value='';
document.getElementById('roomId').value='';
document.getElementById('roomPass').value='';
document.getElementById('matchRules').value='';
document.getElementById('matchStatus').value='upcoming';
document.getElementById('matchModal').classList.add('show');
}

function closeMatchModal(){
document.getElementById('matchModal').classList.remove('show');
editingMatchId=null;
}

function loadMatches(){
db.collection('matches').get().then(function(snapshot){
allMatches=[];
snapshot.forEach(function(doc){
var data=doc.data();
data.id=doc.id;
allMatches.push(data);
});
allMatches.sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt)});
displayMatches();
}).catch(function(error){
document.getElementById('matchList').innerHTML='<div class="empty-state"><div class="empty-icon">X</div><div class="empty-text">Error: '+error.message+'</div></div>';
});
}

function displayMatches(){
var list=document.getElementById('matchList');
if(allMatches.length===0){
list.innerHTML='<div class="empty-state"><div class="empty-icon">🎮</div><div class="empty-text">No Matches Created</div><div class="empty-subtext">Create your first tournament match!</div><button class="create-btn" onclick="openMatchModal()">+ CREATE NEW MATCH</button></div>';
return;
}
var html='';
allMatches.forEach(function(m){
var joined=m.joinedPlayers||0;
var total=m.totalSlots||0;
var slotsText=total>0?(joined+'/'+total):'N/A';
html+='<div class="match-card">'+
'<div class="match-header">'+
'<div class="match-title">'+m.title+'</div>'+
'<div class="match-status status-'+m.status+'">'+m.status+'</div>'+
'</div>'+
'<div class="match-details">'+
'<div class="match-detail-item"><div class="match-detail-label">MODE</div><div class="match-detail-value">'+m.mode+'</div></div>'+
'<div class="match-detail-item"><div class="match-detail-label">MAP</div><div class="match-detail-value">'+m.map+'</div></div>'+
'<div class="match-detail-item"><div class="match-detail-label">ENTRY FEE</div><div class="match-detail-value">'+m.entryFee+' coins</div></div>'+
'<div class="match-detail-item"><div class="match-detail-label">PRIZE POOL</div><div class="match-detail-value">'+m.prizePool+' coins</div></div>'+
'<div class="match-detail-item"><div class="match-detail-label">SLOTS</div><div class="match-detail-value" style="color:#00e676">'+slotsText+'</div></div>'+
'</div>'+
'<div class="match-actions">'+
'<button class="btn-small btn-slots" onclick="viewSlots(\''+m.id+'\')">View Slots</button>'+
'<button class="btn-small btn-edit" onclick="editMatch(\''+m.id+'\')">Edit</button>'+
'<button class="btn-small btn-delete" onclick="deleteMatch(\''+m.id+'\')">Delete</button>'+
'</div>'+
'</div>';
});
list.innerHTML=html;
}

function viewSlots(id){
try{localStorage.setItem('selectedMatchId',id);}catch(e){}
window.location.href='admin-match-slots.html?id='+encodeURIComponent(id);
}

function saveMatch(){
var title=document.getElementById('matchTitle').value.trim();
var entryFee=document.getElementById('entryFee').value;
var totalSlots=document.getElementById('totalSlots').value;
if(!title){showPopup('Error!','Please enter match title',false);return;}
if(!entryFee){showPopup('Error!','Please enter entry fee',false);return;}
if(!totalSlots){showPopup('Error!','Please enter total slots',false);return;}
var matchData={
title:title,
bannerUrl:document.getElementById('bannerUrl').value.trim(),
mode:document.getElementById('matchMode').value,
map:document.getElementById('matchMap').value,
entryFee:parseInt(entryFee),
prizePool:parseInt(document.getElementById('prizePool').value)||0,
totalSlots:parseInt(totalSlots),
joinedPlayers:parseInt(document.getElementById('joinedPlayers').value)||0,
date:document.getElementById('matchDate').value,
time:document.getElementById('matchTime').value,
prizeType:document.getElementById('prizeType').value,
perKillPrize:parseInt(document.getElementById('perKillPrize').value)||0,
booyahPrize:parseInt(document.getElementById('booyahPrize').value)||0,
roomId:document.getElementById('roomId').value.trim(),
roomPass:document.getElementById('roomPass').value.trim(),
rules:document.getElementById('matchRules').value.trim(),
status:document.getElementById('matchStatus').value
};
if(editingMatchId){
db.collection('matches').doc(editingMatchId).update(matchData).then(function(){
showToast('Match Updated!');
closeMatchModal();
loadMatches();
}).catch(function(error){showPopup('Error!','Error: '+error.message,false)});
}else{
matchData.createdAt=new Date().toISOString();
db.collection('matches').add(matchData).then(function(){
showToast('Match Created!');
closeMatchModal();
loadMatches();
}).catch(function(error){showPopup('Error!','Error: '+error.message,false)});
}
}

function editMatch(id){
db.collection('matches').doc(id).get().then(function(doc){
if(!doc.exists){showPopup('Error!','Match not found!',false);return;}
var m=doc.data();
editingMatchId=id;
document.getElementById('modalTitle').textContent='EDIT MATCH';
document.getElementById('matchTitle').value=m.title||'';
document.getElementById('bannerUrl').value=m.bannerUrl||'';
document.getElementById('matchMode').value=m.mode||'Solo';
document.getElementById('matchMap').value=m.map||'Bermuda';
document.getElementById('entryFee').value=m.entryFee||'';
document.getElementById('prizePool').value=m.prizePool||'';
document.getElementById('totalSlots').value=m.totalSlots||'';
document.getElementById('joinedPlayers').value=m.joinedPlayers||0;
document.getElementById('matchDate').value=m.date||'';
document.getElementById('matchTime').value=m.time||'';
document.getElementById('prizeType').value=m.prizeType||'booyah';
document.getElementById('perKillPrize').value=m.perKillPrize||'';
document.getElementById('booyahPrize').value=m.booyahPrize||'';
document.getElementById('roomId').value=m.roomId||'';
document.getElementById('roomPass').value=m.roomPass||'';
document.getElementById('matchRules').value=m.rules||'';
document.getElementById('matchStatus').value=m.status||'upcoming';
document.getElementById('matchModal').classList.add('show');
}).catch(function(error){showPopup('Error!','Error: '+error.message,false)});
}

function deleteMatch(id){
showPopup('Delete Match?','Are you sure you want to delete this match?',true).then(function(result){
if(result===true){
db.collection('matches').doc(id).delete().then(function(){
showToast('Match Deleted!');
loadMatches();
}).catch(function(error){showPopup('Error!','Error: '+error.message,false)});
}
});
}

function showToast(msg){
var toast=document.getElementById('toast');
toast.textContent=msg;
toast.style.display='block';
setTimeout(function(){toast.style.display='none'},2500);
}

document.getElementById('newBtn').addEventListener('click',openMatchModal);
loadMatches();
</script>
</body>
</html>
